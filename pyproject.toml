[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdeobs"
version = "0.1.0"
description = "A controlled benchmark for learning PDE dynamics from partial observations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PDE-OBS contributors" }]
keywords = ["partial differential equations", "neural operators", "benchmark", "partial observation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "h5py>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.13"]
analysis = ["pandas>=2.0", "matplotlib>=3.7"]
site = ["bibtexparser>=1.4.0", "beautifulsoup4>=4.12"]
test = ["pytest>=9.0.3", "pytest-cov>=7.1"]
dev = [
  "torch>=2.13",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "bibtexparser>=1.4.0",
  "beautifulsoup4>=4.12",
  "pytest>=9.0.3",
  "pytest-cov>=7.1",
  "pip-audit>=2.10.1",
  "ruff>=0.16.5",
  "wheel>=0.46.1",
]

[project.scripts]
pdeobs = "pdeobs.cli:main"

[project.entry-points."pdeobs.pdes"]
# Third-party packages can register PDE solvers here.

[project.entry-points."pdeobs.methods"]
# Third-party packages can register benchmark methods here.

[project.urls]
Homepage = "https://ru1ch3n.github.io/PartialObs--PDEBench/"
Repository = "https://github.com/ru1ch3n/PartialObs--PDEBench"
Documentation = "https://ru1ch3n.github.io/PartialObs--PDEBench/"
Issues = "https://github.com/ru1ch3n/PartialObs--PDEBench/issues"
Changelog = "https://github.com/ru1ch3n/PartialObs--PDEBench/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdeobs*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
