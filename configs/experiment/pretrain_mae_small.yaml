include: recovery_unet.yaml
name: pretrain-mae-small

# This compact reference applies an additional 75% patch mask in training mode.
# Copying visible values into the reconstruction makes full-field MSE equivalent
# to a hidden-location objective up to a constant scale.
method:
  name: mae_small
  kwargs:
    in_channels: 1
    out_channels: 1
    width: 32
    latent_channels: 128
    patch_size: 8
    mask_ratio: 0.75
    preserve_visible: true

training:
  loss: mse
