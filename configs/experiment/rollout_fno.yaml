include: recovery_unet.yaml
name: rollout-fno
task: rollout

data:
  root: ${PDEOBS_DATA:-datasets}/signal
  train_glob: "**/*.h5"
  split: iid
  filters:
    pde: heat
    boundary: periodic
    setting: smooth_grf
    regime: low
  input_horizon: 1
  training_horizons: [1, 2]

method:
  name: autoregressive
  base:
    name: fno
    kwargs:
      in_channels: 1
      out_channels: 1
      width: 32
      layers: 4
      modes: 12

evaluation:
  horizons: [1, 2, 4, 8]
  ood_views: [time_horizon]
