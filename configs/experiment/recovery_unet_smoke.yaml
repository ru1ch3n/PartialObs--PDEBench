include: recovery_unet.yaml
name: recovery-unet-smoke

data:
  root: ${PDEOBS_DATA:-datasets}/smoke
  verify_shards: true
  allow_split_fallback: true
  mask:
    protocol: random
    count: 8

method:
  kwargs:
    width: 4

training:
  epochs: 1
  batch_size: 2
  num_workers: 0
  mixed_precision: false
