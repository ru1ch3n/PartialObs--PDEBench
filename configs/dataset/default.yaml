schema_version: 1
name: pdeobs-v0.1-reference
seed: 20260804
tier: tiny
resolution: 128
# Canonical released temporal arrays store 30 ordered snapshots. Numerical
# validation configs may generate denser in-memory trajectories for PDE-loss
# measurement, then persist an exact uniform 30-frame subset.
trajectory_steps: 30
stored_trajectory_steps: 30
samples_per_case: 2000
dtype: float32
compression: gzip
compression_level: 4
# One shard per parameter-regime node in the full tier (max count is 667).
shard_size: 700

families:
  - darcy
  - poisson
  - helmholtz
  - heat
  - reaction_diffusion
  - burgers
  - navier_stokes

boundaries:
  - dirichlet
  - neumann
  - periodic
  - robin_obstacle

settings:
  - smooth_grf
  - medium_grf
  - rough_grf
  - low_frequency_fourier
  - multi_frequency_fourier
  - gaussian_blobs
  - piecewise_blocks
  - threshold_level_set
  - dipole_vortex_pair
  - front_ring_shock

regimes:
  - low
  - medium
  - high

tiers:
  tiny: 5
  debug: 20
  signal: 100
  medium: 500
  full: 2000

splits:
  train: 0.70
  validation: 0.15
  test: 0.15
  regime_allocation_full:
    low: 667
    medium: 667
    high: 666

observations:
  train:
    protocol: random
    count: 500
  evaluation:
    - {protocol: random, ratio: 0.01}
    - {protocol: random, ratio: 0.03}
    - {protocol: random, ratio: 0.05}
    - {protocol: random, ratio: 0.10}
    - {protocol: regular_grid, ratio: 0.03}
    - {protocol: block_missing, missing_fraction: 0.25}
    - {protocol: line_sensors, ratio: 0.03}
    - {protocol: boundary_sensors, ratio: 0.03}
    - {protocol: clustered, ratio: 0.03}

# Dataset-quality measurements are embedded in every sample and summarized per
# shard/dataset.  ``report`` is deliberately non-gating until family-, boundary-,
# resolution-, and dtype-specific thresholds have been independently calibrated.
quality:
  enabled: true
  profile: report
  require_pde_loss: true
  thresholds:
    finite_fraction_min: 1.0
    geometry_binary_max_error_max: 1.0e-6
    initial_condition_loss_normalized_max: 1.0e-6
    boundary_condition_loss_normalized_max: 1.0e-4
    pde_loss_normalized_max: null
    divergence_loss_normalized_max: null

output:
  root: ${PDEOBS_DATA:-datasets}
  atomic: true
  checksum: sha256
