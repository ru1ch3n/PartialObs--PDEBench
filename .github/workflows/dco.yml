name: DCO

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify DCO sign-offs
        run: python scripts/check_dco.py "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
