name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[train,test,site]" ruff
      - name: Check package style
        run: |
          ruff format --check src tests
          ruff check src tests
      - name: Validate shell launchers
        shell: bash
        run: bash -n hpc/seawulf/*.sh hpc/seawulf/*.sbatch
      - name: Validate research records
        run: python scripts/validate_papers.py
      - name: Test
        run: pytest
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
