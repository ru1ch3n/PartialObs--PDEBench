name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Check package style
        run: |
          ruff format --check src tests
          ruff check src tests
      - name: Check benchmark-paper protocol drift
        run: pdeobs protocol --check --config configs/dataset/default.yaml
      - name: Validate shell launchers
        shell: bash
        run: bash -n hpc/seawulf/*.sh hpc/seawulf/*.sbatch
      - name: Validate research records
        run: python scripts/validate_papers.py
      - name: Verify generated benchmark website is current
        run: |
          python scripts/generate_research_site.py
          git diff --exit-code -- docs
      - name: Test
        run: pytest --cov=pdeobs --cov-report=term-missing --cov-report=xml
      - name: Audit installed dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip_audit --local --skip-editable
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python -m venv /tmp/pdeobs-wheel-smoke
          /tmp/pdeobs-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pdeobs-wheel-smoke/bin/python -m pdeobs protocol --check
          /tmp/pdeobs-wheel-smoke/bin/python -c "import os, pdeobs; assert os.environ['GITHUB_WORKSPACE'] not in pdeobs.__file__; print(pdeobs.__file__)"
