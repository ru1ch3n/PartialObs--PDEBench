name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the hash-locked environment
        run: uv sync --locked --extra dev --no-install-project
      - name: Check package style
        env:
          PYTHONPATH: src
        run: |
          uv run --no-sync ruff format --check src tests scripts/check_*.py .clusterfuzzlite/fuzz_config.py
          uv run --no-sync ruff check src tests scripts/check_*.py .clusterfuzzlite/fuzz_config.py
      - name: Verify copyright and license headers
        run: uv run --no-sync python scripts/check_spdx_headers.py
      - name: Check benchmark-paper protocol drift
        env:
          PYTHONPATH: src
        run: uv run --no-sync python -m pdeobs protocol --check --config configs/dataset/default.yaml
      - name: Validate shell launchers
        shell: bash
        run: bash -n hpc/seawulf/*.sh hpc/seawulf/*.sbatch
      - name: Validate research records
        run: uv run --no-sync python scripts/validate_papers.py
      - name: Verify generated benchmark website is current
        run: |
          uv run --no-sync python scripts/generate_research_site.py
          git diff --exit-code -- docs
      - name: Test
        env:
          PYTHONPATH: src
        run: |
          uv run --no-sync pytest --cov=pdeobs --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json:coverage.json
          # These floors prevent regression from the audited baseline. The
          # published Gold target remains 90% statements and 80% branches.
          uv run --no-sync python scripts/check_coverage_thresholds.py coverage.json --min-statements 75 --min-branches 60
      - name: Audit installed dependencies
        if: matrix.python-version == '3.12'
        run: uv run --no-sync python -m pip_audit --local --skip-editable
      - name: Verify reproducible source and wheel builds
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export PYTHONHASHSEED=0
          mkdir -p /tmp/pdeobs-dist-a /tmp/pdeobs-dist-b
          uv build --python .venv/bin/python --no-build-isolation --sdist --wheel --out-dir /tmp/pdeobs-dist-a
          uv build --python .venv/bin/python --no-build-isolation --sdist --wheel --out-dir /tmp/pdeobs-dist-b
          (cd /tmp/pdeobs-dist-a && sha256sum *) > /tmp/pdeobs-dist-a.sha256
          (cd /tmp/pdeobs-dist-b && sha256sum *) > /tmp/pdeobs-dist-b.sha256
          diff -u /tmp/pdeobs-dist-a.sha256 /tmp/pdeobs-dist-b.sha256
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          uv pip install --python .venv/bin/python --reinstall --no-deps /tmp/pdeobs-dist-a/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pdeobs protocol --check
          "$GITHUB_WORKSPACE/.venv/bin/python" -c "import os, pathlib, pdeobs; module = pathlib.Path(pdeobs.__file__).resolve(); source = (pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'src').resolve(); assert not module.is_relative_to(source); assert 'site-packages' in module.parts; print(module)"
