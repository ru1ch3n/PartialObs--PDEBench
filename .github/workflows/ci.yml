name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[train,test,site]" ruff
      - name: Check package style
        run: |
          ruff format --check src tests
          ruff check src tests
      - name: Check benchmark-paper protocol drift
        run: pdeobs protocol --check --config configs/dataset/default.yaml
      - name: Validate shell launchers
        shell: bash
        run: bash -n hpc/seawulf/*.sh hpc/seawulf/*.sbatch
      - name: Validate research records
        run: python scripts/validate_papers.py
      - name: Verify generated benchmark website is current
        run: |
          python scripts/generate_research_site.py
          git diff --exit-code -- docs
      - name: Test
        run: pytest
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python -m venv /tmp/pdeobs-wheel-smoke
          /tmp/pdeobs-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pdeobs-wheel-smoke/bin/python -m pdeobs protocol --check
          /tmp/pdeobs-wheel-smoke/bin/python -c "import os, pdeobs; assert os.environ['GITHUB_WORKSPACE'] not in pdeobs.__file__; print(pdeobs.__file__)"
